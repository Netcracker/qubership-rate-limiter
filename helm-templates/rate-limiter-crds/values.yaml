# The chart has no values. It renders the RateLimitPolicy CRD, which is
# cluster-scoped, so the platform installs it once per cluster, by one release,
# ahead of the rate-limiter-operator and rate-limiter releases of every
# namespace; application pipelines do not install it. Its
# version is the newest operator version in the cluster: schema changes are
# additive, so the newest schema serves every older operator.
