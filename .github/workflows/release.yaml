# Release Workflow
#
# Tags the commit, builds and tests it at that tag, publishes the operator,
# service, and load test images, and creates the GitHub release with notes from
# Release Drafter. Modeled on the manual release of qubership-dbaas: the same
# generic-go-build.yaml the Build workflow calls, run against the new tag.
# The run name, the concurrency group and the tag rollback follow
# qubership-istio's release.
#
# Triggers:
#   - Manual run (workflow_dispatch) on the branch to release from
#
# Dry run creates the tag so the build can check it out, builds the images
# without pushing them, then deletes the tag and skips the release.

name: Release

run-name: >
  Release v${{ inputs.version }}${{ inputs.dry-run && ' (dry run)' || '' }}
  by ${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      version:
        required: true
        default: '1.0.0'
        type: string
        description: 'Release version (e.g., 1.0.0)'
      dry-run:
        required: false
        type: boolean
        default: false
        description: 'Dry run'

# The default token can do nothing; each job asks for what it needs.
permissions: {}

# One release per branch at a time: two runs would race on the tag check.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The tag action substitutes the version into its shell scripts through
  # ${{ }} before the shell parses them, so the quotes there do not contain a
  # crafted value. The version is held to MAJOR.MINOR.PATCH here before
  # anything uses it. No pre-release suffix either: the image tag is rendered
  # as v{{major}}.{{minor}}.{{patch}}, so v1.0.0-rc.1 would publish over the
  # images of v1.0.0.
  validate:
    name: Validate version
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check the version is MAJOR.MINOR.PATCH
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version '$VERSION' is not MAJOR.MINOR.PATCH"
            exit 1
          fi

  create-tag:
    name: Create tag
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create Tag
        uses: netcracker/qubership-workflow-hub/actions/tag-action@e6afd0a6bcc4f24d73e3e4d5fb9a31ada009e3f1 # v2.8.2
        with:
          ref: ${{ github.ref }}
          tag-name: v${{ inputs.version }}
          check-tag: true

  build:
    name: Build, test and publish images
    needs: create-tag
    # Exactly what generic-go-build.yaml declares for itself: a called workflow
    # can only narrow the caller's token, never widen it.
    permissions:
      contents: read
      pull-requests: write
      packages: write
    uses: Netcracker/qubership-core-infra/.github/workflows/generic-go-build.yaml@ed95ad948025728db1e613a3e1a4e6a11186f541 # v2.6.2
    with:
      ref: refs/tags/v${{ inputs.version }}
      dry-run: ${{ inputs.dry-run }}
      # The same module, envtest and Kubernetes version as the Build workflow;
      # see go-build.yml for why each is set. No sonar-project-key: the
      # analysis belongs to main and pull requests, and the release build
      # would otherwise report coverage without the engine module's.
      go-module-dir: .
      install-envtest: true
      kube-version: '1.37.0'
      # The full multi-arch config: the operator, service, and load test images,
      # linux/amd64 and linux/arm64.
      docker-config-file: docker-dev-config.json
    secrets:
      # Declared required by generic-go-build.yaml even when Sonar is skipped.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  cleanup-on-dry-run:
    name: Delete tag after dry run
    needs: build
    if: ${{ inputs.dry-run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete Tag
        uses: netcracker/qubership-workflow-hub/actions/tag-action@e6afd0a6bcc4f24d73e3e4d5fb9a31ada009e3f1 # v2.8.2
        with:
          ref: ${{ github.ref }}
          tag-name: v${{ inputs.version }}
          delete-tag: true

  # A failed or cancelled build or release page leaves no release behind, so
  # the tag goes too; otherwise the next attempt at the same version stops at
  # the tag check. This covers a dry run that does not pass as well.
  cleanup-on-failure:
    name: Delete tag after failure
    needs: [create-tag, build, github-release]
    if: ${{ (failure() || cancelled()) && needs.create-tag.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete Tag on Failure
        uses: netcracker/qubership-workflow-hub/actions/tag-action@e6afd0a6bcc4f24d73e3e4d5fb9a31ada009e3f1 # v2.8.2
        with:
          ref: ${{ github.ref }}
          tag-name: v${{ inputs.version }}
          delete-tag: true

  github-release:
    name: GitHub release
    needs: build
    if: ${{ !inputs.dry-run }}
    # Release Drafter writes the release and reads the merged pull requests
    # its notes are built from.
    permissions:
      contents: write
      pull-requests: read
    uses: netcracker/qubership-workflow-hub/.github/workflows/release-drafter.yml@e6afd0a6bcc4f24d73e3e4d5fb9a31ada009e3f1 # v2.8.2
    with:
      version: ${{ inputs.version }}
      publish: true
